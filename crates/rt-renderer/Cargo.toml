[package]
name = "rt-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.33", features = ["serde"] }
crossbeam-channel = "0.5"
fastrand = "2.4.1"
image = { version = "0.25", features = ["png"] }
rayon = "1.10"
rt-core = { version = "0.1.0", path = "../rt-core" }
rt-scene = { version = "0.1.0", path = "../rt-scene" }
serde_json = "1.0.150"
serde = {version = "1.0.228", features = ["derive"]}
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
optional_struct = "0.5.2"
clap = { version = "4.6.1", features = ["derive"] }
parking_lot = "0.12.5"
exr = "1.74.2"

[dev-dependencies]
axum-test = "20.1.0"
criterion = "0.8.2"
insta = "1.47.2"
proptest = "1.11.0"
tokio-test = "0.4.5"
