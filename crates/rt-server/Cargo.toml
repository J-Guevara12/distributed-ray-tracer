[package]
name = "rt-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
futures-util = "0.3.32"
image = "0.25"
rt-renderer = { version = "0.1.0", path = "../rt-renderer" }
rt-core = { version = "0.1.0", path = "../rt-core" }
rt-scene = { version = "0.1.0", path = "../rt-scene" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing-appender = "0.2.5"
serde = "1.0.228"
optional_struct = "0.5.2"
anyhow = "1.0.104"
parking_lot = "0.12.5"

[dev-dependencies]
axum-test = "20.1.0"
criterion = "0.8.2"
insta = "1.47.2"
proptest = "1.11.0"
tokio-test = "0.4.5"
